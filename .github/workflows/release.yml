name: release

# GitHub Actions — GoReleaser 自动 release (Step 9.3)
#
# 触发条件:
#   - 推送 v* 标签 (如 v0.1.0)
#   - 手动触发 (workflow_dispatch) — 可用于 dry-run
#
# 流程:
#   1. 检出代码
#   2. 设置 Go 1.24
#   3. 运行 GoReleaser: 编译 6 平台二进制 + 上传 GitHub Release
#
# 权限:
#   - contents: write   — 创建/更新 Release
#   - id-token: write   — npm Trusted Publishing (后续工作流)
#
# 注意: 不自动推送 git tag — 按 project_rules 由用户显式触发。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:        # 允许手动触发

permissions:
  contents: write
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
